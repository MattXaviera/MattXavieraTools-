name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "com.mattxaviera.tools",
            "appName": "MattXavieraTools",
            "webDir": "www",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF2
          npx cap add android
          mkdir -p assets && cp icon-only.png assets/icon-only.png
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'
          npx cap sync android
      - name: Build APK release
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Tanda tangani APK dengan keystore tetap
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $UNSIGNED aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias mattxaviera --ks-pass env:KS_PASS --key-pass env:KS_PASS --out MattXavieraTools.apk aligned.apk
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: MattXavieraTools-APK
          path: MattXavieraTools.apk
